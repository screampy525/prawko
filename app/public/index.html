<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<title>Prawko — nauka na egzamin</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888888' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><path d='M3 15.1v-2.3l2.6-.5 2.2-3.3h8.4l2.2 3.3 2.6.5v2.3'/><path d='M3 15.1h18'/><circle cx='7.8' cy='16.5' r='1.9'/><circle cx='16.2' cy='16.5' r='1.9'/></svg>">
</head>
<body>

<!-- ---------- ikony ----------
     Rysowane linią o jednakowej grubości, w jednym miejscu, żeby menu boczne,
     dolna nawigacja i pasek telefonu korzystały z tych samych kształtów.
     Kolor dziedziczą po tekście (stroke: currentColor), więc działają w obu motywach. -->
<svg class="sprite-ikon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="ik-auto" viewBox="0 0 24 24">
    <path d="M3 15.1v-2.3l2.6-.5 2.2-3.3h8.4l2.2 3.3 2.6.5v2.3"/>
    <path d="M3 15.1h18"/>
    <circle cx="7.8" cy="16.5" r="1.9"/>
    <circle cx="16.2" cy="16.5" r="1.9"/>
  </symbol>
  <!-- Pulpit to po polsku deska rozdzielcza - stąd wskaźnik, a nie abstrakcyjny romb. -->
  <symbol id="ik-pulpit" viewBox="0 0 24 24">
    <path d="M4 16.6a8 8 0 0 1 16 0"/>
    <path d="M12 16.6l4.3-4.7"/>
    <circle cx="12" cy="16.6" r="1.1"/>
  </symbol>
  <symbol id="ik-nauka" viewBox="0 0 24 24">
    <path d="M12 7.3C10.4 5.9 7.6 5.3 4.5 5.6v12c3.1-.3 5.9.3 7.5 1.7"/>
    <path d="M12 7.3c1.6-1.4 4.4-2 7.5-1.7v12c-3.1-.3-5.9.3-7.5 1.7"/>
    <path d="M12 7.3v12"/>
  </symbol>
  <symbol id="ik-egzamin" viewBox="0 0 24 24">
    <path d="M9 4.6H7.2A1.7 1.7 0 0 0 5.5 6.3v13a1.7 1.7 0 0 0 1.7 1.7h9.6a1.7 1.7 0 0 0 1.7-1.7v-13a1.7 1.7 0 0 0-1.7-1.7H15"/>
    <rect x="9" y="2.9" width="6" height="3.4" rx="1.1"/>
    <path d="M8.9 13.4l2.4 2.4 4.1-4.9"/>
  </symbol>
  <symbol id="ik-arkusze" viewBox="0 0 24 24">
    <path d="M7 9.6V4.3h10v5.3"/>
    <path d="M7 17.2H5.4a1.9 1.9 0 0 1-1.9-1.9v-3.6a1.9 1.9 0 0 1 1.9-1.9h13.2a1.9 1.9 0 0 1 1.9 1.9v3.6a1.9 1.9 0 0 1-1.9 1.9H17"/>
    <rect x="7" y="14.2" width="10" height="5.9" rx="1.1"/>
  </symbol>
  <symbol id="ik-powtorki" viewBox="0 0 24 24">
    <path d="M20 12a8 8 0 1 1-2.6-5.9"/>
    <path d="M20.3 4.7v4.6h-4.6"/>
  </symbol>
  <symbol id="ik-pulapki" viewBox="0 0 24 24">
    <path d="M12 4.4l8.4 14.3a1.2 1.2 0 0 1-1 1.8H4.6a1.2 1.2 0 0 1-1-1.8z"/>
    <path d="M12 10.1v4.2"/>
    <path d="M12 17.4h.01"/>
  </symbol>
  <symbol id="ik-baza" viewBox="0 0 24 24">
    <path d="M8.2 7H20"/><path d="M8.2 12H20"/><path d="M8.2 17h8"/>
    <path d="M4.4 7h.01"/><path d="M4.4 12h.01"/><path d="M4.4 17h.01"/>
  </symbol>
  <!-- Znak na słupku, a nie sam trójkąt - inaczej myli się z ostrzeżeniem. -->
  <symbol id="ik-znaki" viewBox="0 0 24 24">
    <path d="M12 3.5l6.3 10H5.7z"/>
    <path d="M12 13.5v7"/>
    <path d="M9.2 20.5h5.6"/>
  </symbol>
  <!-- Waga: zasada rozstrzyga, kto ma rację - inaczej niż książka (nauka). -->
  <symbol id="ik-zasady" viewBox="0 0 24 24">
    <path d="M12 5.2v14.3"/>
    <path d="M7.4 19.5h9.2"/>
    <path d="M4 8.4h16"/>
    <path d="M4 8.4l-2.2 5.2a3 3 0 0 0 4.4 0z"/>
    <path d="M20 8.4l-2.2 5.2a3 3 0 0 0 4.4 0z"/>
    <circle cx="12" cy="5.2" r="1.5"/>
  </symbol>
  <symbol id="ik-statystyki" viewBox="0 0 24 24">
    <path d="M4 19.8h16"/>
    <path d="M7.6 19.8v-5.4"/><path d="M12 19.8V8.6"/><path d="M16.4 19.8v-8"/>
  </symbol>
  <symbol id="ik-ustawienia" viewBox="0 0 24 24">
    <path d="M4 7.6h8"/><path d="M16.5 7.6H20"/><circle cx="14.2" cy="7.6" r="2.2"/>
    <path d="M4 16.4h3.6"/><path d="M12 16.4h8"/><circle cx="9.8" cy="16.4" r="2.2"/>
  </symbol>
</svg>

<!-- ---------- ekran logowania ---------- -->
<div id="ekran-logowania" class="ekran-logowania ukryty">
  <div class="logowanie-karta">
    <svg class="ikona logowanie-znak"><use href="#ik-auto"/></svg>
    <h1>Prawko</h1>
    <p class="logowanie-podtytul">Nauka na egzamin teoretyczny</p>

    <form id="formularz-logowania" autocomplete="on">
      <label class="pole">
        <span>Login</span>
        <input type="text" name="login" id="pole-login" autocomplete="username" required>
      </label>
      <label class="pole">
        <span>Hasło</span>
        <input type="password" name="haslo" id="pole-haslo" autocomplete="current-password" required>
      </label>
      <div id="blad-logowania" class="komunikat-bledu ukryty"></div>
      <button type="submit" class="przycisk glowny szeroki" id="przycisk-zaloguj">Zaloguj się</button>
      <button type="button" class="przycisk tekstowy szeroki" id="przelacz-rejestracje">Nie mam konta — załóż nowe</button>
    </form>
  </div>
</div>

<!-- ---------- aplikacja ---------- -->
<div id="aplikacja" class="aplikacja ukryty">

  <aside class="panel-boczny">
    <div class="marka">
      <svg class="ikona ikona-marka"><use href="#ik-auto"/></svg>
      <span class="marka-nazwa">Prawko</span>
    </div>

    <nav class="nawigacja" id="nawigacja">
      <a href="#/pulpit"     data-widok="pulpit"><svg class="ikona"><use href="#ik-pulpit"/></svg> Pulpit</a>
      <a href="#/nauka"      data-widok="nauka"><svg class="ikona"><use href="#ik-nauka"/></svg> Nauka</a>
      <a href="#/egzamin"    data-widok="egzamin"><svg class="ikona"><use href="#ik-egzamin"/></svg> Egzamin</a>
      <a href="#/arkusze"    data-widok="arkusze"><svg class="ikona"><use href="#ik-arkusze"/></svg> Arkusze do druku</a>
      <a href="#/powtorki"   data-widok="powtorki"><svg class="ikona"><use href="#ik-powtorki"/></svg> Powtórki <span class="plakietka" id="licznik-powtorek"></span></a>
      <a href="#/pulapki"    data-widok="pulapki"><svg class="ikona"><use href="#ik-pulapki"/></svg> Podchwytliwe</a>
      <a href="#/baza"       data-widok="baza"><svg class="ikona"><use href="#ik-baza"/></svg> Baza pytań</a>
      <a href="#/znaki"      data-widok="znaki"><svg class="ikona"><use href="#ik-znaki"/></svg> Znaki drogowe</a>
      <a href="#/zasady"     data-widok="zasady"><svg class="ikona"><use href="#ik-zasady"/></svg> Zasady</a>
      <a href="#/statystyki" data-widok="statystyki"><svg class="ikona"><use href="#ik-statystyki"/></svg> Statystyki</a>
      <a href="#/ustawienia" data-widok="ustawienia"><svg class="ikona"><use href="#ik-ustawienia"/></svg> Ustawienia</a>
    </nav>

    <div class="panel-stopka">
      <div class="wybor-kategorii">
        <label for="wybor-kategorii-select">Kategoria</label>
        <select id="wybor-kategorii-select"></select>
      </div>
      <div class="konto">
        <span id="nazwa-uzytkownika"></span>
        <button class="przycisk tekstowy maly" id="przycisk-wyloguj">Wyloguj</button>
      </div>
    </div>
  </aside>

  <!-- Widoczny tylko na telefonie: kategoria i sekcje, których nie ma w dolnej nawigacji. -->
  <header class="pasek-mobilny">
    <svg class="ikona ikona-marka"><use href="#ik-auto"/></svg>
    <select id="wybor-kategorii-mobilny" aria-label="Kategoria prawa jazdy"></select>
    <a href="#/znaki" class="przycisk-paska" data-widok="znaki" aria-label="Znaki drogowe"><svg class="ikona"><use href="#ik-znaki"/></svg></a>
    <a href="#/zasady" class="przycisk-paska" data-widok="zasady" aria-label="Zasady"><svg class="ikona"><use href="#ik-zasady"/></svg></a>
    <a href="#/statystyki" class="przycisk-paska" data-widok="statystyki" aria-label="Statystyki"><svg class="ikona"><use href="#ik-statystyki"/></svg></a>
    <a href="#/ustawienia" class="przycisk-paska" data-widok="ustawienia" aria-label="Ustawienia"><svg class="ikona"><use href="#ik-ustawienia"/></svg></a>
  </header>

  <main class="tresc" id="tresc"></main>

  <nav class="nawigacja-dolna" id="nawigacja-dolna">
    <a href="#/pulpit"     data-widok="pulpit"><svg class="ikona"><use href="#ik-pulpit"/></svg>Pulpit</a>
    <a href="#/nauka"      data-widok="nauka"><svg class="ikona"><use href="#ik-nauka"/></svg>Nauka</a>
    <a href="#/egzamin"    data-widok="egzamin"><svg class="ikona"><use href="#ik-egzamin"/></svg>Egzamin</a>
    <a href="#/powtorki"   data-widok="powtorki"><svg class="ikona"><use href="#ik-powtorki"/></svg>Powtórki</a>
    <a href="#/baza"       data-widok="baza"><svg class="ikona"><use href="#ik-baza"/></svg>Baza</a>
  </nav>
</div>

<div id="ladowanie" class="ladowanie">
  <div class="spinner"></div>
  <p>Wczytywanie bazy pytań…</p>
</div>

<div id="powiadomienie" class="powiadomienie ukryty"></div>

<script src="/app.js"></script>
</body>
</html>
